services:
  web:
    image: nginx:alpine
    container_name: web
    ports:
      - "8080:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/html:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - interna

  api:
    image: traefik/whoami
    container_name: api
    networks:
      - interna

  banco:
    image: redis:alpine
    container_name: banco
    networks:
      - interna

networks:
  interna:
    driver: bridge
